name: ci

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - run: go test ./...
      - run: go vet ./...

  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Compile pure-Go core for Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build ./...

  input-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proprietary inputs
        run: |
          if git ls-files | grep -E '\.(bin|dat|wbin|wbt|fnt|rom|img|mbn|i64|idb)$'; then
            echo "Proprietary or reverse-engineering input is tracked."
            exit 1
          fi
