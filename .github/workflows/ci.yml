name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-amd64
            executable_suffix: .exe
            archive: aram-core-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-amd64
            executable_suffix: ""
            archive: aram-core-linux-amd64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            executable_suffix: ""
            archive: aram-core-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Compile all core packages
        run: go build ./...
      - name: Build headless tools
        shell: bash
        run: |
          mkdir -p build/package dist
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/aram-debug${{ matrix.executable_suffix }}" \
            ./cmd/aram-debug
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/aram-skvm-inspect${{ matrix.executable_suffix }}" \
            ./cmd/aram-skvm-inspect
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/aram-skvm-run${{ matrix.executable_suffix }}" \
            ./cmd/aram-skvm-run
          cp README.md THIRD_PARTY_NOTICES.md build/package/
          cp -R third_party build/package/
      - name: Package Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/package/*' `
            -DestinationPath 'dist/${{ matrix.archive }}'
      - name: Package Unix tools
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C build/package -czf "dist/${{ matrix.archive }}" .
      - name: Upload core tools
        uses: actions/upload-artifact@v7
        with:
          name: aram-core-${{ matrix.platform }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Compile pure-Go core for Android arm64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build ./...

  input-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject proprietary inputs
        run: |
          if git ls-files | grep -E '\.(bin|dat|wbin|wbt|fnt|rom|img|mbn|i64|idb)$'; then
            echo "Proprietary or reverse-engineering input is tracked."
            exit 1
          fi

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - native
      - android-core
      - input-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-core-windows-amd64.zip
          test -f aram-core-linux-amd64.tar.gz
          test -f aram-core-macos-arm64.tar.gz
          sha256sum \
            aram-core-windows-amd64.zip \
            aram-core-linux-amd64.tar.gz \
            aram-core-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Publish rolling Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          title="Nightly ${short_sha}"
          notes="Automated main-branch build from ${GITHUB_SHA}.

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create nightly \
              --verify-tag \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          fi
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload nightly "${assets[@]}" --clobber

  publish-stable:
    if: github.event_name == 'release' && github.event.release.tag_name != 'nightly'
    needs:
      - native
      - android-core
      - input-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-core-windows-amd64.zip
          test -f aram-core-linux-amd64.tar.gz
          test -f aram-core-macos-arm64.tar.gz
          sha256sum \
            aram-core-windows-amd64.zip \
            aram-core-linux-amd64.tar.gz \
            aram-core-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Attach archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
